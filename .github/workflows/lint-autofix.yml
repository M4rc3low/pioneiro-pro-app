name: Temporary lint autofix

on:
  push:
    branches: [chore/repository-polish]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-polish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ESLint fixes
        run: npm run lint:fix

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No lint fixes to commit."
          else
            git commit -m "fix: remove unused imports reported by eslint"
            git push origin HEAD:chore/repository-polish
          fi
